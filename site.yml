---
# Paramètres généraux du Playbook et le ciblage de la machine hôte
- name: Déploiement de la Pile LAMP sur le serveur web
  hosts: webservers
  become: true
  become_method: sudo

  tasks:
    # 1. Listage et mise à jour du catalogue des paquets du serveur
    - name: Mettre à jour le catalogue des paquets du serveur (apt)
      apt:
        update_cache: yes
        cache_valid_time: 3600

    # 2. Mise à jour des paquets du système listés
    - name: Mettre à jour les paquets du système
      apt:
        upgrade: dist

    # 3. Installation des logiciels PHP, Apache2 et module PHP pour le serveur web
    - name: Installation d'Apache2, PHP, Libapache2-mod-php
      apt:
        name:
          - apache2
          - php
          - libapache2-mod-php
        state: present

    # 4. Gestion du service de démarrage d'Apache
    - name: S'assurer que Apache lance son service au démarrage du serveur cible
      service:
        name: apache2
        state: started
        enabled: yes

    # 5. Création du fichier PHP avec ses droits d'utilisation
    - name: Création d'une page d'accueil en PHP
      copy:
        dest: /var/www/html/index.php
        content: |
          <?php
          echo "<h1>Bienvenue sur mon serveur LAMP déployé avec Ansible !</h1>";
          phpinfo();
          ?>
        owner: www-data
        group: www-data
        mode: '0644'
